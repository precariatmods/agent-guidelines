<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">60度の直角三角形</title>
  <desc id="desc">斜辺2、60度の向かい側ルート3、となり側1の直角三角形。sin 60度はルート3分の2、cos 60度は2分の1。</desc>
  <rect width="800" height="560" fill="white"/>
  <g font-family="Yu Gothic,Meiryo,sans-serif" fill="#202a35">
    <text x="400" y="58" text-anchor="middle" font-size="31" font-weight="bold">60°の直角三角形</text>
    <path d="M 200 430 H 390 L 390 101 Z" fill="#f2f7fc" stroke="#202a35" stroke-width="4"/>
    <path d="M 356 430 V 396 H 390" fill="none" stroke="#526170" stroke-width="3"/>
    <path d="M 272 430 A 72 72 0 0 1 236 368" fill="none" stroke="#7043a0" stroke-width="3"/>
    <text x="273" y="385" fill="#7043a0" font-size="27">60°</text>
    <text x="295" y="465" text-anchor="middle" fill="#bc5715" font-size="29">となり側　1</text>
    <text x="423" y="280" fill="#1768ac" font-size="29">向かい側　√3</text>
    <text x="254" y="270" transform="rotate(-60 254 270)" fill="#202a35" font-size="29">斜辺　2</text>
    <text x="400" y="520" text-anchor="middle" font-size="27">sin 60° = 向かい側 ÷ 斜辺 = √3/2　　cos 60° = となり側 ÷ 斜辺 = 1/2</text>
  </g>
</svg>
