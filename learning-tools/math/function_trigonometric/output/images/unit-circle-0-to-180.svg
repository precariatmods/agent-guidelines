<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">0度から180度までの単位円</title>
  <desc id="desc">単位円の上半分に0度、30度、45度、60度、90度、120度、135度、150度、180度を配置した図。第1象限ではcosとsinは正、第2象限ではcosは負でsinは正。</desc>
  <rect width="1000" height="610" fill="white"/>
  <g font-family="Yu Gothic,Meiryo,sans-serif" fill="#202a35">
    <text x="500" y="50" text-anchor="middle" font-size="30" font-weight="bold">0°から180°：角度と符号を一緒に見る</text>
    <path d="M 105 390 H 895 M 500 540 V 90" fill="none" stroke="#b9c2cb" stroke-width="2"/>
    <circle cx="500" cy="390" r="280" fill="#f8fbfe" stroke="#526170" stroke-width="3"/>
    <path d="M 500 390 L 742.5 250 M 500 390 L 698 192 M 500 390 L 640 147.5 M 500 390 V 110 M 500 390 L 360 147.5 M 500 390 L 302 192 M 500 390 L 257.5 250" fill="none" stroke="#b9c2cb" stroke-width="2"/>
    <g fill="#202a35"><circle cx="780" cy="390" r="5"/><circle cx="742.5" cy="250" r="5"/><circle cx="698" cy="192" r="5"/><circle cx="640" cy="147.5" r="5"/><circle cx="500" cy="110" r="5"/><circle cx="360" cy="147.5" r="5"/><circle cx="302" cy="192" r="5"/><circle cx="257.5" cy="250" r="5"/><circle cx="220" cy="390" r="5"/></g>
    <g font-size="22"><text x="805" y="414">0°</text><text x="755" y="244">30°</text><text x="710" y="180">45°</text><text x="646" y="134">60°</text><text x="478" y="94">90°</text><text x="315" y="134">120°</text><text x="260" y="180">135°</text><text x="220" y="244">150°</text><text x="165" y="414">180°</text></g>
    <text x="650" y="485" text-anchor="middle" font-size="27" fill="#1768ac">第1象限：cos ＋、sin ＋</text>
    <text x="350" y="485" text-anchor="middle" font-size="27" fill="#bc5715">第2象限：cos −、sin ＋</text>
    <text x="500" y="574" text-anchor="middle" font-size="25">90°では (cos θ, sin θ) = (0, 1)　　180°では (−1, 0)</text>
  </g>
</svg>
